iptir. CH2 kanalı ise XLR, TRS Phone ve RCA pin jack girişlerini kabul eder. Bu sayede, çeşitli ses kaynaklarını kolayca bağlayabilir ve kullanabilirsiniz.\n\n\n\nKullanım Kolaylığı\n\nDahili mikser, CH1 ve CH2 sinyallerini karıştırmanıza veya sadece CH1 sinyalini geçmenize olanak tanır. Bu özellik, özellikle canlı performanslarda ve farklı ses kaynaklarını aynı anda kullanmanız gerektiğinde büyük bir avantaj sağlar. Ayrıca, DBR Serisi hoparlörler, zemin monitörleme için optimize edilmiş 50° wedge açısına sahiptir. Bu, sahnede veya stüdyoda hoparlörleri zemin monitörü olarak kullanırken mükemmel bir dinleme açısı sağlar.\n\n\nPerformans ve Çok Yönlülük\n\nYamaha DBR Serisi, çeşitli performans uygulamaları için mükemmel bir çözümdür. Hafif ve taşınabilir yapısı sayesinde kolayca taşınabilir ve kurulabilir. Bu özellik, özellikle sık sık yer değiştiren veya taşınabilir ses sistemleri kullanan profesyonel müzisyenler ve ses teknisyenleri için idealdir. Ayrıca, DBR Serisi hoparlörler, hem küçük hem de büyük ölçekli etkinliklerde yüksek performans sunar.\n\nDBR Serisi hoparlörler, güçlü ve net ses çıkışı ile dikkat çeker. Yüksek SPL değerleri, geniş alanlarda bile sesin net ve güçlü olmasını sağlar. Ayrıca, hoparlörlerin geniş frekans tepki aralığı, düşük frekanslardan yüksek frekanslara kadar geniş bir ses yelpazesi sunar. Bu özellikler, DBR Serisi hoparlörleri, konserler, konferanslar, tiyatro prodüksiyonları ve diğer canlı etkinlikler için ideal bir çözüm haline getirir.\n\n\n\n\nTeknik Detaylar\n\nDBR Serisi hoparlörlerin teknik özellikleri, yüksek performans ve dayanıklılık sunmak üzere tasarlanmıştır. Hoparlörlerin frekans tepki aralığı, DBR10 için 55Hz-20kHz, DBR12 için 52Hz-20kHz ve DBR15 için 50Hz-20kHz olarak belirlenmiştir. Maksimum SPL değerleri ise sırasıyla DBR10 için 129dB, DBR12 için 131dB ve DBR15 için 132dB'dir.\n\n\n\n\n\nHoparlörler, yatayda 90° ve dikeyde 60° kapsama alanına sahiptir. Bu geniş kapsama alanı, hoparlörlerin geniş bir dinleme alanını eşi ek ve ayrıca birçok fonksiyona özel atanmış düğmeleri ile performansınız anında hızlı ve kolayca kullanım için herşeyi elinizin altında hissedeceksiniz. WAV dosyalarını yükleyerek kendi enstrüman seslerinizi oluşturabilir ve dileğiniz enstrüman / ses kaynağını direk olarak klavyenize bağlayarak ses örneğini kendiniz alabilirsiniz. Ayrıca güçlü E-A7 Tone Manager yazılımıyla, kullanıcı tonlarını ve davul setlerinizi ayarlama, düzenlemek ve sample sesler ile çalışmak için bilgisayarınızı kullanabilirsiniz. Performanlarında şarkı söyleyenleri menun edecek mikrofon girişi ve ona atanmış özel vokal efektleri ile sadece 8 kg’lik ağırlık ile her yere kolayca taşıyabileceğiniz tam donanımlı bir klavyeyi size sunuyor. Nerede müzik yapmak istiyorsanız, E-A7 size orada tüm yardımlarını sunacaktır.\n1500 adetin üzerinde tüm dünyadan çok yönlü sesler\nDahili sampling fonksiyonu ve WAV dosyalarını yükleyebilme\nAsya, Orta Doğu, Türkiye, Avrupa ve Güney Amerika’dan ritim altyapıları içeren geniş ritim arşivi\nDirek kontrol düğmeleri ile güçlü arranger ses işlemcisi ve One-Touch performans opsiyonları\n156 özel atanmış düğmeler ile çok kullanılan fonksiyonlara hızlıca ulaşabilme\nMantıklı çift-ekran tasarımı ile altyapı ritimleri sol ekranda, sesler sağ ekranda kontrol ile kullanım\nMikrofon girişi ve ona özel atanmış efektler\nSadece 8 Kg lik ağırlığı ile taşıması kolay\nKullanıcı tonları ve davul kitleri oluşturmak, sample seslerinizi içe aktarmak ve düzenlemek ve E-A7 ayarlamalarınızı düzenlemek için E-A7 Tone Manager (Windows / Mac)\nVersiyon 2.00 güncellemesi, kullanıcı geribildirimine dayalı ek ritimler ve operasyon geliştirmeleri sağlar\nTüm Dünyadaki Otantik Seslerinde Dahil Olduğu Geniş Alt Yapı Ritimleri\nE-A7 Batı müziğindeki üstünlüğünün yanında; Asya, Orta Doğu, Avrupa ve Güney Amerika'dan uzman müzisyenler tarafından hazırlanmış tüm dünya müziklerinin altyapı ritimlerini cömert bir dizi ile sunarak, dünyanın diğer bölgelerinden gelen müzik için aynı derecede güçlüdür. Bu nedenle Dünya’nın neresinde çalıyor olduğunuz önemli değildir. E-A7 tüm isteklerinizi tam anlamıyla karşılayacaktır.\nDünyanın Tüm Sesleri Parmaklarınızın Ucunda\nE-A7; kuyruklu piyano, elektrik piyano, org, yaylılar, üflemeliler ve daha birçoğunun da dahil olduğu 1500 adetin üzerinde temel enstrüman seslerini sizlere sunmaktadır. Bu enstrüman seslerinin içerisinde; Orta Doğu, Türkiye, Endonezya, Vietnam ve Doğu Avrupa gibi farklı müzik kültürlerinin enstrümanlarının sesleri de beraberinde gelmektedir. Her ses, en gerçekçi ve yüksek kalite için her biri kendi yerel müzik sahnesinde bir uzman ve başarılı müzisyenler ile işbirliği içinde geliştirilmiştir. Sesler bölgeye göre kategorize edilerek dizilmiştir. Bu sayede performansınız esnasında mükemmel sesleri hızla ve kolayca bulabilirsiniz.\nWAV Sample Sesler Yükleyerek, Dahili Ses Bankalarınızı Genişletin\nHafızasındaki 1500 adetlik dahili tonlar sadece bir başlangıçtır. Birçok performans sanatçısı bugünlerde önceden test ettiği veya kullandığı sample sesleri kullanmaktadır. E-A7’nin sample yükleme fonkisyonu sayesinde, sizde WAV uzantılı ses dosyalarınızı yükleyebilirsiniz. Bunun yanında, dahilindeki sampling fonksiyonu ile kendi özel enstrüman seslerinizi, davul beatleri veya vocal sesleri dahil olmak üzere yaratabilirsiniz. Tek ihtiyacınız olan ses kaynağınızı doğrudan klavyeye bağlamak olacaktır. Daha sonra sesinizi dahada parlatmak ve zenginleştirmek için dahilinde bulunan efektleri ekleyebilir, ve performans show’unuz öncesinde dilediğiniz efektleri deneyerek en mükemmel soundu kolayca yakalayabilirsiniz.\nHızlı, Mantıklı Panel Yerleşimi ile Altyapı Ritimleri Solda, Enstrüman Sesleri Sağda\nBazı arranger klavyelerin birçok fonksiyonu bulunur, fakat bunları kullanmak biraz karmaşık ve zordur. Özellikle kalabalık ve güzel bir akşam için beklentisi olan insanların önünde bu durum daha da zorlaşmaktadır. E-A7 ise mantıklı olarak yerleştirilen, sol tarafta alt yapı ritimlerini, sağ tarafta ise enstrüman seslerini ve bunlarla ilgili bilgileri gösteren iki ayrı bölümün kendine özel LCD ekranıyla donatılmıştır. Bunun yanında 156 adet hızlı erişim düğmesi ile en çok kullandığınız birçok fonksiyona hızlıca erişebilir, klavye üzerinde ayarlar ile uğraşmak yerine müziğinize daha fazla zamnınızı ayıracak, doğru düğme kombinasyonlarını bulmak için panic yaşamayacaksınız.\nMükemmel Bir Performans için Tüm Temeller Parmaklarınızın Ucunda\nSahnede çalarken, sadece işinize odaklanmaya ihtiyacınız olacak. Çünkü E-A7; en çok kullandığınız birçok fonksiyona size direk ulaşım imkanını sunmaktadır. Altı adet pad’leri üzerinde ihtiyacınız olduğu and ses dosyalarınızı veya MIDI phrase’lerinizi çaldırabilirsiniz. Sadece bu bölge üzerinde bir tuşa dokunarak farklı müzikal scale’lere ulaşabileceksiniz. Ayrıca dahilindeki altı adetlik slider kontrolleriyle, davul, bas ve akumpanya gibi her bir bölümün ses seviyelerini ayarlayabilirsiniz. Son olarak, dahilindeki pitch-bend kolunun üst kısmında bulunan yedi adetlik görev atanabilir düğmeleri, sizin kişisel gereksinimlerinize göre ne yapmak istiyorsanız ayarlayabileceğiniz ve pitch bend kolu üzerinden elinizi kaldırmadan ulaşabileceğiniz şekilde dizayn edildi.\nMikrofonunuzu Bağlayın, Sesinizi Ayarlayın ve Şarkı Söylemeye Başlayın\nEğer repertuarınızın önemli bir bölümünü vokal partileri içeriyorsa, E-A7 mikrofon girişi ile birlikte ön panelinde özel ses seviyesi kontrolünü size sunarak, sadece bir potans çevirerek klavyenin system menüsü içerisinde kaybolmanıza gerek kalmadan vokal ses seviyenizi hızlıca ayarlayabilirsiniz. Ayrıca profesyonel seviyedeki vokal efektleri ile sesinizi cilalandıracak ve parlatacak, performansınız anında çok yönlü dahilindeki reverb ve delay efektlerini ayarlayabilirsiniz.\nSadece 8 Kg Ağırlık ile Her Yere Rahatça Taşıyın\nHer zaman sahnede çalarken ihtiyacınız olan herşeyin bir arada olması mükemmeldir. Aksi taktirde ağır bir klavye ve diğer ekipmanları taşımak biraz belinize acı verebilir. E-A7 sahne müzisyenlerinin hayatlarına iki yönde kolaylık getiriyor. İlk olarak mükemmel bir performans için herşeyin bir arada olmasıyla ekstra kutu taşımanıza veya bağlantılar yapmanıza gerek olmadan hemen sahneye hazır olabilmenizdir. İkincisi ise performansınız öncesinde veya sonrasında hafif gövdesiyle kolayca her yere taşıyabilmenizdir. 61 tuşlu kompakt yapısının içerisine birçok güç ile donatılmış ve sadece 8 kg ağırlığıyla, size belinize acı vermeden klavyenizi bir yerden bir yere götürebilmenizi sunuyor.\nÇok Yönlü, SMF Şarkı Çalıcısı ile Birlikte WAV/MP3 Audio Dosyaları da Çalabilme\nE-A7’ nin dahilindeki şarkı çalıcısı Standart MIDI dosyalarını (SMF) okuyabilir ve bunun yanında WAV ve MP3 ses dosyalarını da çalabilmektedir. Kapsamlı çalma seçenekleri ile şarkının bir bölümünü tekrar etmek, bir bölümüne atlamak gibi farklı işlemlere izin verebilir. Eğer WAV ses dosyası çaldırıyorsanız, Center Cancel özelliği ile vokal kanallarını minimize edip kendi sesiniz için alan yaratıp üzerine kendi sesinizle vokal yapabilirsiniz. Ayrıca hali hazırdaki performanslarınızı kayıt edip, WAV ses dosyası formatında USB hafıza biriminizde saklayabilirsiniz. Bu sayede müziğinizi sosyal ortamlarda paylaşmanız için saatlerce uğraşmanıza gerek kalmayacaktır.\nEsnek Kullanıcı Programları Kontrolü Sizin Elinize Sunuyor\nE-A7 tasarlandığından itibaren düğmelerinde ve slider kontrollerinde size “zorunlu-gerekli” olan tüm kontroller parmaklarınızın altında bulunuyor. Ayrıca; temel ayarlamalarınızın açık-kapalı durumları, otomatik atak veya giriş efektleri gibi birçok ayarlarınızı tek bir programa kayıt edebilirsiniz. Bu kontroldeki ilave katmanlar sayesinde klavyenizin her bir ayarını her bir şarkıya kayıt edebilir ve çalarken anında geçiş yapabilirsiniz. Roland’ın BK serisi arranger klavyelerinden gelen kullanıcı programlarını USB hafıza birimi üzerinden okuyabilmektedir.\nKullanıcı Tonları/Davul Kitleri, Sample Sesleriniz ve Daha Fazlasını Bilgisayarınızda Yönetin\nE-A7 Tone Manager yazılımı, Mac veya Windows bilgisayarla E-A7 deneyimlerinizi geliştirmenizi sağlar. Kullanıcı tonları ve davul kitleri oluşturmak, performans ayarlarını yapmak ve tüm E-A7 ton verilerinizi yönetmek için ton kütüphanesi, editör ve sample ses yaratıcı işlevler bulunur. Büyük bilgisayar ekranınızda birden fazla parametre gösterilerek, herhangi bir müzik tarzı için E-A7 ayarlarınızı kişiselleştirmek ve düzenlemek artık daha da kolay.","whatsappNote":"","tags":"","images":["https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-183931338-png.png","https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-183948026-png.png","https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-184054987-png.png"],"order":200,"originalUrl":"https://tr.roland.com/products/e-a7/","category":"Music"},{"id":"11100320300359","name":"Event 2030 3Yollu Studyo Monitörü (TAKIM çift)","barcode":"11100320300359","brand":"Event","model":"2030","price":"48.700,00","priceNumber":48700,"qty":1,"status":"Satılık","type":"İkinci El – Yeni Gibi","featured":false,"shortDesc":"Takım olarak(2 kolon), Stüdyoda temiz kullanılmış, kutulu, hiç bir fiziki ve elektronik hatası yoktur.","description":"Event 2030 3Yollu Studyo Monitörü\nEvent'in hoparlör konusundaki geçmişi ve başarısı herkes tarafından kabul edilmiş bir gerçektir. Event 20/20 serisi ile stüdyo monitör'ing imkanını tüm dünya'da sayısız sanatçı ve mühendislere sunmuş ve stüdyoların vazgeçilmezi haline gelmiştir.\nEvent'in ilk üç yollu monitörü olan 2030 ile bu başarılı geçmiş yepyeni ve daha da parlak bir gelecek ile buluşuyor. 2030 kendi kategorisini yeniden tanımlayan ve tüm frekans spektrumu boyunca inanılmaz doğrulukta sound veren üç farklı sürücüye sahip 3-yollu bir stüdyo referans monitörüdür\nÜç Sürücü\nEvent 2030 kendi sınıfında karşılaştırılamayacak performans sunan 3-yollu bir stüdyo monitörüdür.\n2030, inanılmaz detaylı ve geniş bir sound sunmak üzere üç müstakil sürücülü, son derece hassas bir şekilde tasarlanmış akustik dizayn, sinyal işleme ve amplifikatör teknolojisine sahiptir. Elde edilen bass cevabı ise bu boyutlardaki bir hoparlörden beklenenin çok çok üzerindedir.\nHigh-Mid Sürücü\nYeni 2030 ile birlikte Event mühendisleri üç-yollu hoparlör konseptini yepyeni bir boyuta taşımıştır. Bunun sonucu olarak sınıfını yeniden tanımlayan, cazip performans ve fiziksel boyutlara sahip benzersiz bir yakın dinleme monitörü ortaya çıkmıştır.\nYeni wave guide düzeneği hoparlörün mid-range ve yüksek frekans sürücülerini barındırarak ses dağılımı ile güç ve cevap karakteristiklerini optimize etmek üzere tasarlanmıştır.\nKritik orta frekans sürücüsü için tasarlanan 3.5\" lik koni transducer (güç çevirici) preslenmiş kağıt hamuru ve polypropylen'den oluşan koni ile birlikte optimize edilmiş bir manyetik devreden oluşmaktadır. Sürücü derin olmayan bir waveguide üzerine yerleştirilerek çok düşük distorsiyon ve yüksek hassasiyet ile yüksek çıkış gücü sağlanmıştır. Tüm bu özellikler 2030 referans monitörlerine inanılmaz detaylı ve belirgin bir vokal karakteri kazandırmaktadır.","whatsappNote":"","tags":"","images":["https://adaespor.sentos.com.tr/urunres/o_gorsel-2026-05-09-224837925-png.png","https://adaespor.sentos.com.tr/urunres/o_gorsel-2026-05-09-224904972-png.png","https://adaespor.sentos.com.tr/urunres/o_gorsel-2026-05-09-224916550-png.png"],"order":210,"originalUrl":"https://www.audiotechnology.com/reviews/event-2030-three-way-active-nearfield-monitors","category":"Music"},{"id":"Pmq58nvva7199k","name":"UTAX P-4531 MFP","barcode":"","brand":"UTAX","model":"P-4531 MFP","price":"44.500,00","priceNumber":44500,"qty":1,"status":"Satılık","type":"İkinci El – Yeni Gibi","featured":false,"shortDesc":"2.el çok temiz. tüm fonksiyonları kusursuz çalışır durumda ağdan kullanılabilir.","description":"General\nType\nDesktop\nFunction\nCopy, print, scan\nPrint technology\nLaser b/w\nOriginal format\nmax A4 from platen glass\nOriginal feeder\n75 sheet document processor with automatic reverse function, A6R-A4, 50-120 g/m² (standard)\nCopy reso Satılık","type":"İkinci El – İyi","featured":false,"shortDesc":"kullanılmış, tüm fonksiyonları ve ses kontrol kutusu çalışır. kafa üst bantları biraz yıpranmış.","description":"HyperX Cloud Core daha önce kaçırdıklarınızı duymanızı sağlamak ve en iyi Hi-Fi oyun deneyimini sunmak için sesi ve konuşmaları yükselten yeniden tasarlanmış bir USB ses kartı ses kontrol kutusu bulunmaktadır. Diğer oyuncuların asla bilemeyecekleri bir detay dünyasına dalın - bir kampçının ayak çıtırtısı ya da uzaktaki bir havalandırma deliğinden gelen ses. Bağımsız ses ve mikrofon ses seviyesi kontrolleri hem ses yüksekliğini hem de mikrofon ses seviyesini ayarlamanızı sağlarken Surround Sound 7.1'i ve mikrofon sesini kolayca açıp kapatmanıza imkan tanır.\n\nOyunda rakiplerinizin yerini tespit edin ve sizin geldiğinizi görmeden saldırıya geçin. Donanım tabanlı ve tak çalıştır özellikli olmasından dolayı sürücü yüklenmesi gerekmez.\n\nHyperX Cloud II, otomatik kazanım kontrolü işlevine sahip dijital olarak geliştirilmiş, gürültü önleyen bir mikrofona sahiptir ve yankı yok etme özelliği USB ses kartı üzerinden sağlanmaktadır.\n\nSonuçta zorlu savaşlar sırasında takım içi iletişimi ve oyun içi sohbeti en iyi duruma getirmek için oyundaki ses seviyesi yükseldikçe ses seviyesinin otomatik olarak arttırılmasıyla daha net ses kalitesi ve daha az arka plan gürültüsü elde edersiniz.\n\nYüksek kaliteli USB Ses Kartı\n7.1 Sanal Surround Ses\nDijital İyileştirme Özellikli Mikrofon\nc2_3\n\nGelişmiş ses kontrol kutusu\nSurround Sound 7.1'i sadece bir düğmeye dokunarak açabilir ve kapatabilirsiniz. Daha kullanışlı bir tasarım için bağımsız ses ve mikrofon sesi seviyesi kontrollerine sahiptir. Dahili ses kartı DSP, en iyi HiFi oyun deneyimi için ses ve konuşmaları yükseltir.\n\nc2_3\n\n7.1 Virtual Surround Sound\nHer türlü oyun, film ya da müzik deneyimini geliştiren bir mesafe ve derinlik oluşturmak için sanal surround ses deneyimi oluşturun. Tak ve çalıştır özelliklidir, dolayısıyla hiçbir sürücü gerektirmez.\n\nc2_4\n\nÜstün ses performansı\nHyperX Cloud II, 53 mm'lik sürücülerle HiFi özelliklidir ve oyun ya da profesyonel ses ortamlarında üstün ses performansı sağlar. Kristal berraklığındaki düşük, orta ve yüksek tonlar ve gelişmiş bas oluşturma özelliği üç boyutlu oyun oynama deneyimi yaratır.\n\nc2_5\n\nDijital iyileştirme özellikli mikrofon\nUSB kontrol kutusu ile kullanıldığında gürültü azaltma, AGC işlevi ve yankı azaltma özellikleri etkinleştirilir. Daha iyi genel ses deneyimi için daha net ses kalitesi ve daha az arka plan gürültüsü elde edin. Çıkarılabilir mikrofon, oyun oynamak için kullanırken kolayca takılabilirken müzik dinlemek için kullanılırken kolayca çıkarılabilir.\n\nc2_6\n\nTeamSpeak Onaylı\nTeamSpeak, konuşma kalitesinin net ve ses kalitesinin mükemmel olduğunu onaylamaktadır. Testlerde işitilebilir yankı, arka plan gürültüsü ya da ses bozulmaları tespit edilmemiştir. Diğer uyumlu sohbet istemcileri arasında Skype, Mumble ve Ventrilo bulunmaktadır.\n\nc2_7\n\nGelişmiş Konfor\nHyperX Cloud II, çeşitli ses profilleri ve farklı desen seçenekleri için değiştirilebilir kulaklık kapakları ve %100 hafızalı sünger kulaklık yastıkları ile birlikte gelir.\n\nc2_8\n\nProfesyonel Oyun için Optimize Edilmiştir\nIntel Extreme Masters'in resmi kulaklığı olan HyperX Cloud II, rahatça oyun oynamanızı ve PC, Mac ve oyun konsollarında en iyi ses deneyimini elde etmenizi sağlar. Kapalı kulaklık haznesi tasarımı pasif gürültü azaltmaya olanak tanır ve tam performansınızla rekabet etmenizi sağlar.","whatsappNote":"","tags":"","images":["https://adaespor.sentos.com.tr/urunres/o_img-0031.JPG","https://adaespor.sentos.com.tr/urunres/o_img-0031-jpg1.jpeg"],"order":999,"originalUrl":"","category":""},{"id":"Pmuiqsarfwng8f","name":"Kingston 8GB HyperX Fury Black DDR4 2400MHz CL15  Ram HX424C15FB2/8","barcode":"","brand":"","model":"","price":"2.300,00","priceNumber":2300,"qty":6,"status":"Satılık","type":"İkinci El – İyi","featured":false,"shortDesc":"","description":"", s\n\nMesafe\n\n30 metreye kadar 10 Gbps","whatsappNote":"","tags":"","images":["https://adaespor.sentos.com.tr/urunres/o_img-0058.JPG","https://cdn.mikrotik.com/web-assets/rb_images/1351_xl.webp"],"order":999,"originalUrl":"https://mikrotik.com/product/s_rj10","category":"Switch"},{"id":"Pmujfl5rqb2far","name":"MSI MAG B550 Tomahawk AM4 Soket Anakart","barcode":"4719072728625","brand":"","model":"","price":"6.250,00","priceNumber":6250,"qty":1,"status":"Satılık","type":"İkinci El – Yeni Gibi","featured":false,"shortDesc":"sıfır kullanılmamış ürün. kutu açılmış.","description":"MSI MAG B550 TOMAHAWK\nCore Boost Teknolojisi\nÖzenle tasarlanan yapısı ile maksimum performansın zincirlerini kırmaya hazır.\n \n6 katmanlı PCB\n6 katmanlı devre kartı, hem daha yüksek performans, hem de hiçbir ödün vermeyen, daha uzun ömürlü bir sistem kararlılığı anlamına gelir.\n \n2oz kalınlaştırılmış bakır PCB\nDevre kartının kalınlaştırılması hem ısı gideriminin arttırılmasını, hem de yüksek performansın daha kararlı olmasını sağlar.\n \nDijital PWM\nEn yüksek kalitede bileşenlerin kullanıldığı dijital güç entegreleri sisteminizin en zor koşullarda bile akıcı çalışmasını sağlar.\n \nPCIe Steel Armor\nEkran kartlarını bükülme ve elektromanyetik girişime karşı koruyarak daha yüksek performans göstermelerini sağlar.\n \n\n\n\nÜST SEVİYE TERMAL ÇÖZÜM\nGenişletilmiş Heatsink\nMSI’ın genişleştilmiş güç yönetimi ve devre tasarımı, üst sınıf işlemcilerin tam hızda çalışmasına yardımcı olur.\n \nM.2 Shield Frozr\nGüçlendirilmiş dahili M.2 termal çözümü, M.2 SSD’lerinizi ısınmaya bağlı tıkanmalara ve fiziksel hasarlara karşı koruyarak daha hızlı çalışmalarını sağlar.\n \nPompa Fanı Desteği\nEn iyi soğutma ve gürültü kontrolü için su soğutma pompasını kontrol etme imkanı.\n \n7W/mK Termal yastıklara sahip Heatsink\n7W/mK Termal yastıklar, heatsink üzerine daha verimli ısı transferi sağlar.\n \n\n\n\nYÜKSEK İLETİM HIZI\n2.5G ve Gigabit LAN\nTümleşik 2.5G, Gigabit LAN, LAN yöneticisi ile birlikte online ağ deneyiminizi gecikmesiz ve sorunsuz hale getiriyor.\n \nTurbo USB\nTURBO USB 3.2 Gen 2 10Gb/sn hızında ve Type-C konnektörü ile gelir.\n \nDDR4 Boost\nTamamen izole edilen DDR4 devreleri sayesinde bellek sinyalleri daha saf ve kararlı bir şekilde iletilir.\n \nLightning Gen 4 Çözümü\nEn yeni Gen 4 PCI-E ve M.2 çözümü, 64GB/sn’ye varan bant genişliği ile maksimum veri transfer hızı sunuyor.\n \n\n\n\n\n\n\nÇOK ÇEKİRDEKTE YÜKSEK PERFORMANS İÇİN EN UYGUN TERMAL ÇÖZÜM\nİşlemcilerde çekirdek sayısı arttıkça, sistem sıcaklığını düşük tutacak termal ve güç tasarımları önem kazanıyor. MSI’ın genişletilmiş PWM heatsink ve geliştirilmiş devre tasarımı, en üst seviye işlemcilerin bile MSI anakartlarda tam güç ve hızda çalışmasını sağlar.\nTWIN TURBO M.2 ve M.2 SHIELD FROZR\nNVMe SSD’nizin soğutulması, ısınmaya bağlı tıkanmaları geciktirerek genel sistem performansını arttırır. Anakartın heatsink tasarımına dahil olan bu özellik sayesinde SSD’lerinizin ısınarak yavaşlaması engellenir ve en iyi termal koruma sağlanır.\n\n\n10 + 2 + 1 DUET RAIL GÜÇ SİSTEMİ\nKararlı eşzamanlı güç iletimi sunan agresif voltaj düzenleme yöneticisi, 8pin güç konnektörleri ve Core Boost teknolojisini bir araya getiriyor. Böylece MAG serisi anakartlar son derece yüksek yük altında bile maksimum performansı sunmaya devam ediyor.\n2oz KALINLAŞTIRILMIŞ BAKIR PCB\nDevre kartının 2 oz ağırlıklı bakır ile kalınlaştırılması hem ısı gideriminin arttırılmasını, hem de yüksek performansın daha kararlı olmasını sağlar.\n\n\nLIGHTNING GEN 4 Çözümü\nYeni Gen4 PCI-E ve M.2 çözümü ile 64GB/sn’ye varan bant genişliği sunuyor. PCIe 4.0 arayüzü hem eski, hem de yeni standartlarla uyum sağlayan hem geriye, hem de ileriye dönük uyumluluğa sahiptir.\nOYUN SİSTEMİNİZİ ÖZELLEŞTİRİN\nMystic Light uygulamasını veya mobil cihazınızı kullanarak tek tıklamayla PC’nizi 16.8 milyon renk ve 29 efektle donatın.\n\n\n2.5G LAN İLE DUAL LAN\nMAG B550 TOMAHAWK talepkar tasarımcılar ve ileri seviye kullanıcılar için yüksek bant genişliği ve düşük gecikme sunan 2.5G destekli çift LAN donanımına sahiptir. Tümleşik 2.5Gbps bağlantısı ile daha öncekine göre çok daha yüksek bir veri transfer hızına sahiptir. MSI LAN Manager, gecikmeye duyarlı uygulamaları otomatik olarak algılayarak öncelik veriri; böylece her zaman en iyi online deneyimi yaşayabilirsiniz.\nCORE BOOST\nCore Boost teknolojisi MSI’ın özel yerleşim ve dijital güç tasarımı sayesinde işlemciye saf ve kararlı akım iletilmesini sağlar. Böylece çok çekirdekli işlemcilerin sürekli tam hızda çalışabilmelerine olanak tanır.\n\n\nBENZERSİZ BELLEK PERFORMANSI\nMSI anakartlar, sisteminizin bellek donanımına destek verecek birçok özellikle donatılmıştır. Böylece çok daha kararlı bir çalışma ve hızaşırtma performansı sunar. Tamamen izole edilen bellek devreleri sayesinde artık sisteminizin çökmesinden endişe etmeyeceksiniz.\nÇOKLU GPU DESTEĞİ VE STEEL ARMOR\nMAG B550 TOMAHAWK anakart, birden fazla ekran kartını aynı anda kullanma olanağı sunar. Konumu özenle hesaplanan PCI-Express yuvası, daha iyi bir hava akımı ve daha rahat yerleşim sağlar. Böylece en yüksek FPS değerleri için AMD® CrossFire™ ile birden fazla ekran kartı kullanabilirsiniz. Devre kartı üzerinde daha fazla lehime sahip Steel Armor ile PCI-Express yuvanız hem bükülme gibi yapısal hasarlara, hem de elektromanyetik girişim sinyallerine karşı korunur.\n\n\nAUDIO BOOST İLE OYUNDA SES DENEYİMİNİZİ GELİŞTİRİN\nTıpkı harici bir ses kartı gibi çalışan Audio Boost, anakartın diğer bölümlerinden tamamen izole edilen HD ses işlemcisi, yüksek kaliteye sahip ses kapasitörleri ve adanmış ses amplifikatörü sayesinde ses sinyalinin mümkün olan en saf haliyle ulaşmasını sağlar. Böylece rakiplerinizi sadece dinleyerek bile bulabilirsiniz.","whatsappNote":"","tags":"","images":["https://cdn.vatanbilgisayar.com/Upload/PRODUCT/msi/thumb/TeoriV2-108218_large.jpg","https://adaespor.sentos.com.tr/urunres/o_img-0062.JPG","https://adaespor.sentos.com.tr/urunres/o_img-0063.JPG"],"order":999,"originalUrl":" function home(){var arr=getProducts();var featured=arr.find(function(p){return p.featured})||arr[0];var cards=arr.filter(function(p){return !featured||idOf(p)!==idOf(featured)});var html=headerHtml()+heroHtml(featured)+'<div class="result-count">'+arr.length+' ürün gösteriliyor</div>';if(!arr.length)html+='<div class="empty"><div><b>Ürün bulunamadı</b><span>Arama veya filtreyi değiştirerek tekrar deneyin.</span></div></div>';else html+='<section class="grid">'+cards.map(cardHtml).join('')+'</section>';html+='<footer class="foot"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 45c10-6 22-6 34 0 5 2 8 2 12 0"/><path d="M8 52c10-5 22-5 34 0 6 2 10 2 14 0"/><path d="M22 30c5-8 12-13 23-12"/><path d="M33 20c-3 7-5 14-5 23"/><circle cx="14" cy="13" r="5"/></svg><div><b>'+esc(S.siteTitle||'Ada eMarket Ürün Vitrini')+'</b><br>Kaliteli ürünler, doğru insanlar.</div></footer>';qs('#app').innerHTML=html;wireHome()}
function findProduct(id){return products.find(function(p){return String(idOf(p))===String(id)||String(p.barcode||'')===String(id)})}
function detail(id){var p=findProduct(id);if(!p){home();return}currentProduct=p;var imgs=(p.images&&p.images.length?p.images:[imgOf(p)]).filter(Boolean);var main=imgs[0]||'';var similar=products.filter(function(x){return idOf(x)!==idOf(p)&&((x.brand&&x.brand===p.brand)||(x.status&&x.status===p.status)||(String(x.type||'')===String(p.type||'')))}).slice(0,4);var html=headerHtml()+'<a class="back" href="./">← Vitrine dön</a><section class="detail"><div class="detail-gallery"><div class="stage detail-stage"><img id="mainImg" src="'+esc(main)+'" alt="'+esc(titleOf(p))+'" onerror="this.style.opacity=.15"></div><div class="thumbs">'+imgs.map(function(src,i){return '<button class="thumb '+(i===0?'active':'')+'" data-src="'+esc(src)+'"><img src="'+esc(src)+'" alt=""></button>'}).join('')+'</div></div><div class="detail-info"><div class="badge-row">'+categoryBadge(p)+typeBadge(p)+statusBadge(p)+(p.featured?'<span class="badge featured">Öne çıkan</span>':'')+tagBadges(p,3)+'</div><h1>'+esc(titleOf(p))+'</h1><div class="subline">'+esc(metaOf(p))+'</div><div class="price">'+esc(priceOf(p))+'</div><div class="barcode"><b>Barkod/EAN:</b> '+esc(p.barcode||'-')+' &nbsp; <b>Adet:</b> '+esc(p.qty??1)+'</div><div class="detail-actions"><a class="act primary" href="'+phoneHref()+'">'+icon('phone')+' Telefonla Ara</a><a class="act whatsapp" target="_blank" rel="noopener" href="'+waLink(p)+'">'+icon('wa')+' WhatsApp</a><button class="act" data-action="copy" data-id="'+esc(idOf(p))+'">'+icon('copy')+' Link Kopyala</button>'+(p.originalUrl?'<a class="act" target="_blank" rel="noopener" href="'+esc(p.originalUrl)+'">Orijinal Sayfa '+icon('arrow')+'</a>':'')+'</div>'+(p.shortDesc?'<div class="section"><h3>Kısa Açıklama</h3><div class="text">'+esc(p.shortDesc)+'</div></div>':'')+'<div class="section"><h3>Açıklama</h3><div class="text">'+esc(p.description||'Bu ürün hakkında detaylı bilgi için bizimle iletişime geçebilirsiniz.')+'</div></div></div></section>'+(similar.length?'<section class="similar"><h2>Benzer ürünler</h2><div class="grid">'+similar.map(cardHtml).join('')+'</div></section>':'');qs('#app').innerHTML=html;wireHome();qsa('.thumb').forEach(function(b){b.addEventListener('click',function(){qsa('.thumb').forEach(function(x){x.classList.remove('active')});this.classList.add('active');qs('#mainImg').src=this.dataset.src})})}
function wireHome(){var si=qs('#searchInput');if(si){si.addEventListener('input',function(){var start=this.selectionStart,end=this.selectionEnd;searchText=this.value;home();var input=qs('#searchInput');input.focus();input.setSelectionRange(start,end)})}var ss=qs('#sortSel');if(ss){ss.value=sortMode;ss.addEventListener('change',function(){sortMode=this.value;home()})}qsa('[data-filter]').forEach(function(c){c.addEventListener('click',function(){activeFilter=this.dataset.filter||'';home()})});qsa('[data-category]').forEach(function(c){c.addEventListener('click',function(){activeCategory=this.dataset.category||'';home()})})}
document.addEventListener('click',function(e){var btn=e.target.closest('[data-action]');if(!btn)return;if(btn.dataset.action==='copy'){e.preventDefault();copyLink(btn.dataset.id)}});
var params=new URLSearchParams(location.search);if(params.get('urun'))detail(params.get('urun'));else home();
</script></body></html>
