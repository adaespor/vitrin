inde tüm dünyadan çok yönlü sesler\nDahili sampling fonksiyonu ve WAV dosyalarını yükleyebilme\nAsya, Orta Doğu, Türkiye, Avrupa ve Güney Amerika’dan ritim altyapıları içeren geniş ritim arşivi\nDirek kontrol düğmeleri ile güçlü arranger ses işlemcisi ve One-Touch performans opsiyonları\n156 özel atanmış düğmeler ile çok kullanılan fonksiyonlara hızlıca ulaşabilme\nMantıklı çift-ekran tasarımı ile altyapı ritimleri sol ekranda, sesler sağ ekranda kontrol ile kullanım\nMikrofon girişi ve ona özel atanmış efektler\nSadece 8 Kg lik ağırlığı ile taşıması kolay\nKullanıcı tonları ve davul kitleri oluşturmak, sample seslerinizi içe aktarmak ve düzenlemek ve E-A7 ayarlamalarınızı düzenlemek için E-A7 Tone Manager (Windows / Mac)\nVersiyon 2.00 güncellemesi, kullanıcı geribildirimine dayalı ek ritimler ve operasyon geliştirmeleri sağlar\nTüm Dünyadaki Otantik Seslerinde Dahil Olduğu Geniş Alt Yapı Ritimleri\nE-A7 Batı müziğindeki üstünlüğünün yanında; Asya, Orta Doğu, Avrupa ve Güney Amerika'dan uzman müzisyenler tarafından hazırlanmış tüm dünya müziklerinin altyapı ritimlerini cömert bir dizi ile sunarak, dünyanın diğer bölgelerinden gelen müzik için aynı derecede güçlüdür. Bu nedenle Dünya’nın neresinde çalıyor olduğunuz önemli değildir. E-A7 tüm isteklerinizi tam anlamıyla karşılayacaktır.\nDünyanın Tüm Sesleri Parmaklarınızın Ucunda\nE-A7; kuyruklu piyano, elektrik piyano, org, yaylılar, üflemeliler ve daha birçoğunun da dahil olduğu 1500 adetin üzerinde temel enstrüman seslerini sizlere sunmaktadır. Bu enstrüman seslerinin içerisinde; Orta Doğu, Türkiye, Endonezya, Vietnam ve Doğu Avrupa gibi farklı müzik kültürlerinin enstrümanlarının sesleri de beraberinde gelmektedir. Her ses, en gerçekçi ve yüksek kalite için her biri kendi yerel müzik sahnesinde bir uzman ve başarılı müzisyenler ile işbirliği içinde geliştirilmiştir. Sesler bölgeye göre kategorize edilerek dizilmiştir. Bu sayede performansınız esnasında mükemmel sesleri hızla ve kolayca bulabilirsiniz.\nWAV Sample Sesler Yükleyerek, Dahili Ses Bankalarınızı Genişletin\nHafızasındaki 1500 adetlik dahili tonlar sadece bir başlangıçtır. Birçok performans sanatçısı bugünlerde önceden test ettiği veya kullandığı sample sesleri kullanmaktadır. E-A7’nin sample yükleme fonkisyonu sayesinde, sizde WAV uzantılı ses dosyalarınızı yükleyebilirsiniz. Bunun yanında, dahilindeki sampling fonksiyonu ile kendi özel enstrüman seslerinizi, davul beatleri veya vocal sesleri dahil olmak üzere yaratabilirsiniz. Tek ihtiyacınız olan ses kaynağınızı doğrudan klavyeye bağlamak olacaktır. Daha sonra sesinizi dahada parlatmak ve zenginleştirmek için dahilinde bulunan efektleri ekleyebilir, ve performans show’unuz öncesinde dilediğiniz efektleri deneyerek en mükemmel soundu kolayca yakalayabilirsiniz.\nHızlı, Mantıklı Panel Yerleşimi ile Altyapı Ritimleri Solda, Enstrüman Sesleri Sağda\nBazı arranger klavyelerin birçok fonksiyonu bulunur, fakat bunları kullanmak biraz karmaşık ve zordur. Özellikle kalabalık ve güzel bir akşam için beklentisi olan insanların önünde bu durum daha da zorlaşmaktadır. E-A7 ise mantıklı olarak yerleştirilen, sol tarafta alt yapı ritimlerini, sağ tarafta ise enstrüman seslerini ve bunlarla ilgili bilgileri gösteren iki ayrı bölümün kendine özel LCD ekranıyla donatılmıştır. Bunun yanında 156 adet hızlı erişim düğmesi ile en çok kullandığınız birçok fonksiyona hızlıca erişebilir, klavye üzerinde ayarlar ile uğraşmak yerine müziğinize daha fazla zamnınızı ayıracak, doğru düğme kombinasyonlarını bulmak için panic yaşamayacaksınız.\nMükemmel Bir Performans için Tüm Temeller Parmaklarınızın Ucunda\nSahnede çalarken, sadece işinize odaklanmaya ihtiyacınız olacak. Çünkü E-A7; en çok kullandığınız birçok fonksiyona size direk ulaşım imkanını sunmaktadır. Altı adet pad’leri üzerinde ihtiyacınız olduğu and ses dosyalarınızı veya MIDI phrase’lerinizi çaldırabilirsiniz. Sadece bu bölge üzerinde bir tuşa dokunarak farklı müzikal scale’lere ulaşabileceksiniz. Ayrıca dahilindeki altı adetlik slider kontrolleriyle, davul, bas ve akumpanya gibi her bir bölümün ses seviyelerini ayarlayabilirsiniz. Son olarak, dahilindeki pitch-bend kolunun üst kısmında bulunan yedi adetlik görev atanabilir düğmeleri, sizin kişisel gereksinimlerinize göre ne yapmak istiyorsanız ayarlayabileceğiniz ve pitch bend kolu üzerinden elinizi kaldırmadan ulaşabileceğiniz şekilde dizayn edildi.\nMikrofonunuzu Bağlayın, Sesinizi Ayarlayın ve Şarkı Söylemeye Başlayın\nEğer repertuarınızın önemli bir bölümünü vokal partileri içeriyorsa, E-A7 mikrofon girişi ile birlikte ön panelinde özel ses seviyesi kontrolünü size sunarak, sadece bir potans çevirerek klavyenin system menüsü içerisinde kaybolmanıza gerek kalmadan vokal ses seviyenizi hızlıca ayarlayabilirsiniz. Ayrıca profesyonel seviyedeki vokal efektleri ile sesinizi cilalandıracak ve parlatacak, performansınız anında çok yönlü dahilindeki reverb ve delay efektlerini ayarlayabilirsiniz.\nSadece 8 Kg Ağırlık ile Her Yere Rahatça Taşıyın\nHer zaman sahnede çalarken ihtiyacınız olan herşeyin bir arada olması mükemmeldir. Aksi taktirde ağır bir klavye ve diğer ekipmanları taşımak biraz belinize acı verebilir. E-A7 sahne müzisyenlerinin hayatlarına iki yönde kolaylık getiriyor. İlk olarak mükemmel bir performans için herşeyin bir arada olmasıyla ekstra kutu taşımanıza veya bağlantılar yapmanıza gerek olmadan hemen sahneye hazır olabilmenizdir. İkincisi ise performansınız öncesinde veya sonrasında hafif gövdesiyle kolayca her yere taşıyabilmenizdir. 61 tuşlu kompakt yapısının içerisine birçok güç ile donatılmış ve sadece 8 kg ağırlığıyla, size belinize acı vermeden klavyenizi bir yerden bir yere götürebilmenizi sunuyor.\nÇok Yönlü, SMF Şarkı Çalıcısı ile Birlikte WAV/MP3 Audio Dosyaları da Çalabilme\nE-A7’ nin dahilindeki şarkı çalıcısı Standart MIDI dosyalarını (SMF) okuyabilir ve bunun yanında WAV ve MP3 ses dosyalarını da çalabilmektedir. Kapsamlı çalma seçenekleri ile şarkının bir bölümünü tekrar etmek, bir bölümüne atlamak gibi farklı işlemlere izin verebilir. Eğer WAV ses dosyası çaldırıyorsanız, Center Cancel özelliği ile vokal kanallarını minimize edip kendi sesiniz için alan yaratıp üzerine kendi sesinizle vokal yapabilirsiniz. Ayrıca hali hazırdaki performanslarınızı kayıt edip, WAV ses dosyası formatında USB hafıza biriminizde saklayabilirsiniz. Bu sayede müziğinizi sosyal ortamlarda paylaşmanız için saatlerce uğraşmanıza gerek kalmayacaktır.\nEsnek Kullanıcı Programları Kontrolü Sizin Elinize Sunuyor\nE-A7 tasarlandığından itibaren düğmelerinde ve slider kontrollerinde size “zorunlu-gerekli” olan tüm kontroller parmaklarınızın altında bulunuyor. Ayrıca; temel ayarlamalarınızın açık-kapalı durumları, otomatik atak veya giriş efektleri gibi birçok ayarlarınızı tek bir programa kayıt edebilirsiniz. Bu kontroldeki ilave katmanlar sayesinde klavyenizin her bir ayarını her bir şarkıya kayıt edebilir ve çalarken anında geçiş yapabilirsiniz. Roland’ın BK serisi arranger klavyelerinden gelen kullanıcı programlarını USB hafıza birimi üzerinden okuyabilmektedir.\nKullanıcı Tonları/Davul Kitleri, Sample Sesleriniz ve Daha Fazlasını Bilgisayarınızda Yönetin\nE-A7 Tone Manager yazılımı, Mac veya Windows bilgisayarla E-A7 deneyimlerinizi geliştirmenizi sağlar. Kullanıcı tonları ve davul kitleri oluşturmak, performans ayarlarını yapmak ve tüm E-A7 ton verilerinizi yönetmek için ton kütüphanesi, editör ve sample ses yaratıcı işlevler bulunur. Büyük bilgisayar ekranınızda birden fazla parametre gösterilerek, herhangi bir müzik tarzı için E-A7 ayarlarınızı kişiselleştirmek ve düzenlemek artık daha da kolay.","whatsappNote":"","tags":"","images":["https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-183931338-png.png","https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-183948026-png.png","https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-184054987-png.png"],"order":200,"source":"Sentos Excel","id":"4957054507020","originalUrl":"https://tr.roland.com/products/e-a7/"},{"id":"11100320300359","name":"Event 2030 3Yollu Studyo Monitörü (TAKIM çift)","barcode":"11100320300359","brand":"Event","model":"2030","price":"48.700,00","priceNumber":48700,"qty":1,"status":"Satılık","type":"İkinci El – Yeni Gibi","publish":true,"featured":false,"shortDesc":"Takım olarak(2 kolon), Stüdyoda temiz kullanılmış, kutulu, hiç bir fiziki ve elektronik hatası yoktur.","description":"Event 2030 3Yollu Studyo Monitörü\nEvent'in hoparlör konusundaki geçmişi ve başarısı herkes tarafından kabul edilmiş bir gerçektir. Event 20/20 serisi ile stüdyo monitör'ing imkanını tüm dünya'da sayısız sanatçı ve mühendislere sunmuş ve stüdyoların vazgeçilmezi haline gelmiştir.\nEvent'in ilk üç yollu monitörü olan 2030 ile bu başarılı geçmiş yepyeni ve daha da parlak bir gelecek ile buluşuyor. 2030 kendi kategorisini yeniden tanımlayan ve tüm frekans spektrumu boyunca inanılmaz doğrulukta sound veren üç farklı sürücüye sahip 3-yollu bir stüdyo referans monitörüdür\nÜç Sürücü\nEvent 2030 kendi sınıfında karşılaştırılamayacak performans sunan 3-yollu bir stüdyo monitörüdür.\n2030, inanılmaz detaylı ve geniş bir sound sunmak üzere üç müstakil sürücülü, son derece hassas bir şekilde tasarlanmış akustik dizayn, sinyal işleme ve amplifikatör teknolojisine sahiptir. Elde edilen bass cevabı ise bu boyutlardaki bir hoparlörden beklenenin çok çok üzerindedir.\nHigh-Mid Sürücü\nYeni 2030 ile birlikte Event mühendisleri üç-yollu hoparlör konseptini yepyeni bir boyuta taşımıştır. Bunun sonucu olarak sınıfını yeniden tanımlayan, cazip performans ve fiziksel boyutlara sahip benzersiz bir yakın dinleme monitörü ortaya çıkmıştır.\nYeni wave guide düzeneği hoparlörün mid-range ve yüksek frekans sürücülerini barındırarak ses dağılımı ile güç ve cevap karakteristiklerini optimize etmek üzere tasarlanmıştır.\nKritik orta frekans sürücüsü için tasarlanan 3.5\" lik koni transducer (güç çevirici) preslenmiş kağıt hamuru ve polypropylen'den oluşan koni ile birlikte optimize edilmiş bir manyetik devreden oluşmaktadır. Sürücü derin olmayan bir waveguide üzerine yerleştirilerek çok düşük distorsiyon ve yüksek hassasiyet ile yüksek çıkış gücü sağlanmıştır. Tüm bu özellikler 2030 referans monitörlerine inanılmaz detaylı ve belirgin bir vokal karakteri kazandırmaktadır.","whatsappNote":"","tags":"","images":["https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-224837925-png.png","https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-224904972-png.png","https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-224916550-png.png"],"order":210,"source":"Sentos Excel","originalUrl":"https://www.audiotechnology.com/reviews/event-2030-three-way-active-nearfield-monitors"}]};</script>

function featuredHtml(){var feat=products.filter(function(p){return p.featured});if(!feat.length)return '';var p=feat[0];var src=img(p);var imgEl=src?'<img class="feat-img" src="'+e(src)+'" alt="" loading="lazy">':'<span style="font-size:56px;opacity:.25">📦</span>';var waId=e(p.id);return '<div class="feat-wrap"><div class="feat-card" data-id="'+e(p.id)+'"><div class="feat-img-wrap">'+imgEl+'<span class="feat-badge">⭐ Öne Çıkan</span></div><div class="feat-body"><div class="feat-brand">'+e((p.brand||'Ürün')+' · '+((p.type||'Sıfır')))+'</div><div class="feat-name">'+e(title(p))+'</div><div class="feat-meta">'+e('Adet: '+(p.qty||1)+' · '+(p.barcode||''))+'</div><div class="feat-ptag"><span class="n">'+e(p.price||'?')+'</span><span class="c">'+(S.currency||'TL')+'</span></div><div class="feat-btns"><button class="wa-btn" data-action="wa" data-id="'+waId+'">💬 WhatsApp’tan Sor</button>'+(S.phoneNumber?'<a class="ph-btn" href="tel:'+e(String(S.phoneNumber).replace(/\s/g,''))+'">📞 Ara</a>':'')+'</div></div></div></div>'}
function cardHtml(p){var isSold=p.status==='Satıldı';var isRes=p.status==='Rezerve';var cardCls='card'+(isSold?' sold':'');var imgCls='card-img'+(isSold?' sold-img':'');var pTagCls=priceTagCls(p.status);var typeCls=ptagClass(p.type);var src=img(p);var imgEl=src?'<img src="'+e(src)+'" alt="" loading="lazy">':'<span class="no-img">📦</span>';var sbadge=isRes?'<span class="sbadge res">Rezerve</span>':isSold?'<span class="sbadge sold">Satıldı</span>':'';var btn=isSold?'<button class="card-sold-btn">Satıldı</button>':'<button class="card-wa" data-action="wa" data-id="'+e(p.id)+'">💬 WhatsApp’tan Sor</button>';return '<div class="'+cardCls+'" data-id="'+e(p.id)+'"><div class="'+imgCls+'">'+imgEl+sbadge+'<div class="ptag '+pTagCls+'"><span class="n">'+e(p.price||'?')+'</span><span class="c">'+(S.currency||'TL')+'</span></div></div><div class="card-body"><div class="card-brand">'+e(p.brand||'')+'</div><div class="card-name">'+e(title(p))+'</div><div class="card-type'+( typeCls?' '+typeCls:'')+'">'+e(p.type||'Sıfır')+'</div>'+btn+'</div></div>'}
function drawProducts(){var arr=filtered(),box=document.getElementById('products');if(!box)return;updateActiveFilters();if(!arr.length){box.className='';box.innerHTML='<div class="empty"><div class="empty-icon">📦</div><h3>Ürün bulunamadı</h3><p>Arama kriterlerine uygun ürün yok.</p></div>';return}box.className='grid';box.innerHTML=arr.map(cardHtml).join('')}
function listPage(){app.innerHTML=headerHtml()+subFiltersHtml()+'<div class="active-filters" id="activeFilters"></div><span class="result-count" id="resultCount"></span>'+featuredHtml()+'<div class="content"><div id="products"></div></div><div class="vt-footer">'+e(S.siteTitle||'Ada eMarket')+(S.defaultLocation?' · '+e(S.defaultLocation):'')+'</div>';var chips=document.querySelectorAll('.chip');chips.forEach(function(c){c.classList.toggle('active',c.dataset.sf===statusFilter);c.addEventListener('click',function(){statusFilter=this.dataset.sf;chips.forEach(function(x){x.classList.remove('active')});this.classList.add('active');drawProducts()})});var qEl=document.getElementById('q');if(qEl)qEl.addEventListener('input',drawProducts);var sortEl=document.getElementById('sort');if(sortEl)sortEl.addEventListener('change',drawProducts);var pmin=document.getElementById('pmin'),pmax=document.getElementById('pmax'),papply=document.getElementById('papply');if(papply)papply.addEventListener('click',function(){minPrice=pmin?pmin.value:'';maxPrice=pmax?pmax.value:'';drawProducts()});drawProducts()}
function waLink(p){var n=String(S.waNumber||'').replace(/[^0-9]/g,'');var productUrl=new URL(location.href);productUrl.searchParams.set('urun',p.id);var msg='Merhaba, '+(S.siteTitle||'vitrin')+' üzerinde gördüğüm ürün hakkında bilgi almak istiyorum.\n\nÜrün: '+title(p)+'\nBarkod/EAN: '+(p.barcode||'-')+'\nFiyat: '+money(p)+'\nDurum: '+(p.status||'-')+'\nAdet: '+(p.qty||1)+'\nLink: '+productUrl.href+(p.whatsappNote?'\n\nNot: '+p.whatsappNote:'');return 'https://wa.me/'+n+'?text='+encodeURIComponent(msg)}
window.copyLink=function(id){var url=new URL(location.href);url.searchParams.set('urun',id);navigator.clipboard.writeText(url.href).then(function(){alert('Link kopyalandı')})}
window.openWa=function(id){var p=products.find(function(x){return String(x.id)===String(id)});if(p)window.open(waLink(p),'_blank')}
function openLightbox(images,index){lbImages=images;lbIndex=index;var lb=document.getElementById('lightbox');var lbImg=document.getElementById('lbImg');var lbCount=document.getElementById('lbCount');lbImg.src=images[index];lbCount.textContent=(index+1)+' / '+images.length;lb.classList.add('open')}
function lbNext(){if(lbImages.length<2)return;lbIndex=(lbIndex+1)%lbImages.length;document.getElementById('lbImg').src=lbImages[lbIndex];document.getElementById('lbCount').textContent=(lbIndex+1)+' / '+lbImages.length}
function lbPrev(){if(lbImages.length<2)return;lbIndex=(lbIndex-1+lbImages.length)%lbImages.length;document.getElementById('lbImg').src=lbImages[lbIndex];document.getElementById('lbCount').textContent=(lbIndex+1)+' / '+lbImages.length}
window.openLightbox=openLightbox;window.lbNext=lbNext;window.lbPrev=lbPrev;
function detail(id){var p=products.find(function(x){return String(x.id)===String(id)})||products.find(function(x){return String(x.barcode)===String(id)});if(!p){listPage();return}
var imgs=p.images||[];var th=tagsHtml(p);var origBtn=p.originalUrl?'<a class="orig-btn" href="'+e(p.originalUrl)+'" target="_blank">🔗 Orijinal Ürün Sayfası</a>':'';
var shortSec=p.shortDesc?'<h3 class="sec-title">Açıklama</h3><p class="sec-text" style="margin-bottom:20px">'+e(p.shortDesc)+'</p>':'';
var similar=getSimilar(p);var similarHtml='';if(similar.length){similarHtml='<div class="similar-section"><h3 class="similar-title">Benzer Ürünler</h3><div class="similar-scroll">'+similar.map(function(sp){return '<div class="similar-card" data-id="'+e(sp.id)+'"><img src="'+e(img(sp))+'" alt="" loading="lazy"><div class="sc-body"><div class="sc-title">'+e(title(sp))+'</div><div class="sc-price">'+e(money(sp))+'</div></div></div>'}).join('')+'</div></div>'}
var breadcrumb='<div class="breadcrumb"><a href="#" id="homeLink">Ana Sayfa</a> &rsaquo; '+e(p.brand||'Ürün')+' &rsaquo; '+e(title(p))+'</div>';
app.innerHTML=headerHtml()+'<div class="content">'+breadcrumb+'<button class="back-btn" id="backBtn">← Listeye dön</button><div class="detail"><div class="dgrid"><div><div class="main-img-wrap"><img id="mainImg" class="main-img" src="'+e(imgs[0]||'')+'" alt="" onclick="window.openLightbox(['+imgs.map(function(s){return "'"+s.replace(/'/g,"\\'")+"'"}).join(',')+'],0)"></div><div class="thumbs">'+imgs.map(function(src,i){return '<img src="'+e(src)+'" alt=""'+(i===0?' class="active"':'')+'>'}).join('')+'</div></div><div><h1 class="dtitle">'+e(title(p))+'</h1><div class="dprice-tag"><span class="n">'+e(p.price||'?')+'</span><span class="c">'+(S.currency||'TL')+'</span></div><div class="dbadges"><span class="badge '+(p.status==='Rezerve'?'badge-reserved':p.status==='Satıldı'?'badge-sold':'badge-hide')+'">'+e(p.status||'')+'</span> <span class="badge '+(p.type==='Sıfır'?'badge-new':'badge-used')+'">'+e(p.type||'')+'</span> <span class="badge" style="background:#EDE9E2;color:#7D6E61">Adet: '+e(p.qty||1)+'</span></div>'+(th?'<div class="tags-wrap">'+th+'</div>':'')+'<div class="dbarcode"><strong>Barkod / EAN:</strong> '+e(p.barcode||'-')+'</div><div class="divider"></div><div class="actions"><a class="wa-btn" href="'+e(waLink(p))+'" target="_blank" id="detailWa">💬 WhatsApp’tan Sor</a>'+(S.phoneNumber?'<a class="ph-btn" href="tel:'+e(String(S.phoneNumber).replace(/\s/g,''))+'" id="detailPh">📞 Telefonla Ara</a>':'')+(origBtn?origBtn:'')+'<button class="copy-btn" id="copyLinkBtn">📋 Linki Kopyala</button></div><div class="divider"></div>'+shortSec+'<h3 class="sec-title">Özellikler</h3><p class="sec-text">'+e(p.description||'Özellik bilgisi bulunmuyor.')+'</p></div></div></div>'+similarHtml+'</div>';
document.getElementById('backBtn').addEventListener('click',goHome);
document.getElementById('homeLink').addEventListener('click',function(ev){ev.preventDefault();goHome()});
document.getElementById('copyLinkBtn').addEventListener('click',function(){var url=new URL(location.href);navigator.clipboard.writeText(url.href).then(function(){alert('Link kopyalandı')})});
document.querySelectorAll('.thumbs img').forEach(function(im){im.addEventListener('click',function(){document.querySelectorAll('.thumbs img').forEach(function(x){x.classList.remove('active')});this.classList.add('active');document.getElementById('mainImg').src=this.src})});
var stickyCta=document.getElementById('stickyCta');var stickyWa=document.getElementById('stickyWa');var stickyPh=document.getElementById('stickyPh');if(stickyCta){stickyCta.style.display='flex';if(stickyWa)stickyWa.href=waLink(p);if(stickyPh&&S.phoneNumber)stickyPh.href='tel:'+String(S.phoneNumber).replace(/\s/g,'')}
var touchStartX=0;var mainImgWrap=document.querySelector('.main-img-wrap');if(mainImgWrap){mainImgWrap.addEventListener('touchstart',function(e){touchStartX=e.changedTouches[0].screenX});mainImgWrap.addEventListener('touchend',function(e){var diff=touchStartX-e.changedTouches[0].screenX;if(Math.abs(diff)>50){var thumbs=document.querySelectorAll('.thumbs img');var active=0;thumbs.forEach(function(t,i){if(t.classList.contains('active'))active=i});if(diff>0&&active<thumbs.length-1)thumbs[active+1].click();else if(diff<0&&active>0)thumbs[active-1].click()}})}}
function render(){var u=new URL(location.href);var id=u.searchParams.get('urun');if(id)detail(id);else{var stickyCta=document.getElementById('stickyCta');if(stickyCta)stickyCta.style.display='none';listPage()}}
document.addEventListener('click',function(ev){var actionBtn=ev.target.closest('[data-action]');if(actionBtn){ev.preventDefault();ev.stopPropagation();var aid=actionBtn.getAttribute('data-id');var action=actionBtn.getAttribute('data-action');if(action==='copy')window.copyLink(aid);if(action==='wa')window.openWa(aid);return}var el=ev.target.closest('[data-id]');if(el){ev.preventDefault();openProduct(el.getAttribute('data-id'))}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')document.getElementById('lightbox').classList.remove('open');if(ev.key==='ArrowRight')lbNext();if(ev.key==='ArrowLeft')lbPrev()});
window.onpopstate=render;
try{render()}catch(err){app.innerHTML='<div style="padding:24px"><h2>Hata</h2><pre>'+e(err&&err.message?err.message:err)+'</pre></div>';console.error(err)}
})();
</script>
</body>
</html>
