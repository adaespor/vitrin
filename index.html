alse,"shortDesc":"","description":"Yüksek Güç, Hafif Tasarım\n\nYamaha DBR Serisi, kompakt ve dayanıklı yapısıyla dikkat çeken bir hoparlör serisidir. Bu hoparlörler, yüksek performanslı 1000W sınıf-D amplifikatörleri ile 132dB SPL'ye kadar net ve güçlü bir ses sunar. Bu özellikler, DBR Serisi'ni hem taşınabilir hem de son derece güçlü hale getirir. Özellikle sahne performansları ve taşınabilir ses sistemleri için ideal bir çözüm sunar. DBR10, DBR12 ve DBR15 modelleri, hafif tasarımları ve sağlam yapıları ile her türlü zorlu kullanım koşuluna dayanıklıdır.\n\nİleri Düzey Ses Yetenekleri\n\nDBR hoparlörler, özel tasarlanmış yüksek güçlü woofer'lar ve hassas sıkıştırma sürücüleri sayesinde minimal distorsiyon ile güçlü bas ve net yüksek frekanslar üretir. Bu, özellikle geniş alanlarda ve yüksek ses seviyelerinde bile sesin net ve anlaşılır olmasını sağlar. Ayrıca, hoparlörlerin dış yapısı, darbelere ve dış etkenlere karşı dayanıklı olacak şekilde tasarlanmıştır, böylece uzun süreli kullanımda bile güvenilir performans sunar.\n\n\n\nGelişmiş Ses\n\nDBR Serisi hoparlörler, kullanıcı dostu özellikleri ile dikkat çeker. İki kanallı mikser, farklı giriş seçenekleri ve kolay ayarlanabilir kontroller ile kullanım kolaylığı sağlar. CH1 kanalı, hem Mic hem de Line seviyesinde giriş sinyallerini kabul eden bir kombo jack'a sahiptir. CH2 kanalı ise XLR, TRS Phone ve RCA pin jack girişlerini kabul eder. Bu sayede, çeşitli ses kaynaklarını kolayca bağlayabilir ve kullanabilirsiniz.\n\n\n\nKullanım Kolaylığı\n\nDahili mikser, CH1 ve CH2 sinyallerini karıştırmanıza veya sadece CH1 sinyalini geçmenize olanak tanır. Bu özellik, özellikle canlı performanslarda ve farklı ses kaynaklarını aynı anda kullanmanız gerektiğinde büyük bir avantaj sağlar. Ayrıca, DBR Serisi hoparlörler, zemin monitörleme için optimize edilmiş 50° wedge açısına sahiptir. Bu, sahnede veya stüdyoda hoparlörleri zemin monitörü olarak kullanırken mükemmel bir dinleme açısı sağlar.\n\n\nPerformans ve Çok Yönlülük\n\nYamaha DBR Serisi, çeşitli performans uygulamaları için mükemmel bir çözümdür. Hafif ve taşınabilir yapısı sayesinde kolayca taşınabilir ve kurulabilir. Bu özellik, özellikle sık sık yer değiştiren veya taşınabilir ses sistemleri kullanan profesyonel müzisyenler ve ses teknisyenleri için idealdir. Ayrıca, DBR Serisi hoparlörler, hem küçük hem de büyük ölçekli etkinliklerde yüksek performans sunar.\n\nDBR Serisi hoparlörler, güçlü ve net ses çıkışı ile dikkat çeker. Yüksek SPL değerleri, geniş alanlarda bile sesin net ve güçlü olmasını sağlar. Ayrıca, hoparlörlerin geniş frekans tepki aralığı, düşük frekanslardan yüksek frekanslara kadar geniş bir ses yelpazesi sunar. Bu özellikler, DBR Serisi hoparlörleri, konserler, konferanslar, tiyatro prodüksiyonları ve diğer canlı etkinlikler için ideal bir çözüm haline getirir.\n\n\n\n\nTeknik Detaylar\n\nDBR Serisi hoparlörlerin teknik özellikleri, yüksek performans ve dayanıklılık sunmak üzere tasarlanmıştır. Hoparlörlerin frekans tepki aralığı, DBR10 için 55Hz-20kHz, DBR12 için 52Hz-20kHz ve DBR15 için 50Hz-20kHz olarak belirlenmiştir. Maksimum SPL değerleri ise sırasıyla DBR10 için 129dB, DBR12 için 131dB ve DBR15 için 132dB'dir.\n\n\n\n\n\nHoparlörler, yatayda 90° ve dikeyde 60° kapsama alanına sahiptir. Bu geniş kapsama alanı, hoparlörlerin geniş bir dinleme alanını eşit ve net bir şekilde kaplamasını sağlar. Ayrıca, hoparlörlerin düşük frekans dönüştürücüleri, DBR10 için 10\" koni, DBR12 için 12\" koni ve DBR15 için 15\" koni olarak tasarlanmıştır. Yüksek frekans dönüştürücüleri ise 1\" sıkıştırma sürücüsüdür.\n\n\nTeknik Özellikler\n\nGenel Özellikler\tDeğerler\nFrekans Tepkisi\tDBR10 (55Hz-20kHz), DBR12 (52Hz-20kHz), DBR15 (50Hz-20kHz)\nMaksimum SPL\tDBR10 (129dB), DBR12 (131dB), DBR15 (132dB)\nNominal Kapsama\tYatay 90°, Dikey 60°\nGirişler\tXLR, TRS, RCA\nÇıkışlar\tXLR\nGüç\tDBR10 (700W), DBR12 (1000W), DBR15 (1000W)\nAğırlık\tDBR10 (10.5 kg), DBR12 (15.8 kg), DBR15 (19.3 kg)\nBoyutlar\tDBR10 (308 x 493 x 289 mm), D  çok yönlü sesler\nDahili sampling fonksiyonu ve WAV dosyalarını yükleyebilme\nAsya, Orta Doğu, Türkiye, Avrupa ve Güney Amerika’dan ritim altyapıları içeren geniş ritim arşivi\nDirek kontrol düğmeleri ile güçlü arranger ses işlemcisi ve One-Touch performans opsiyonları\n156 özel atanmış düğmeler ile çok kullanılan fonksiyonlara hızlıca ulaşabilme\nMantıklı çift-ekran tasarımı ile altyapı ritimleri sol ekranda, sesler sağ ekranda kontrol ile kullanım\nMikrofon girişi ve ona özel atanmış efektler\nSadece 8 Kg lik ağırlığı ile taşıması kolay\nKullanıcı tonları ve davul kitleri oluşturmak, sample seslerinizi içe aktarmak ve düzenlemek ve E-A7 ayarlamalarınızı düzenlemek için E-A7 Tone Manager (Windows / Mac)\nVersiyon 2.00 güncellemesi, kullanıcı geribildirimine dayalı ek ritimler ve operasyon geliştirmeleri sağlar\nTüm Dünyadaki Otantik Seslerinde Dahil Olduğu Geniş Alt Yapı Ritimleri\nE-A7 Batı müziğindeki üstünlüğünün yanında; Asya, Orta Doğu, Avrupa ve Güney Amerika'dan uzman müzisyenler tarafından hazırlanmış tüm dünya müziklerinin altyapı ritimlerini cömert bir dizi ile sunarak, dünyanın diğer bölgelerinden gelen müzik için aynı derecede güçlüdür. Bu nedenle Dünya’nın neresinde çalıyor olduğunuz önemli değildir. E-A7 tüm isteklerinizi tam anlamıyla karşılayacaktır.\nDünyanın Tüm Sesleri Parmaklarınızın Ucunda\nE-A7; kuyruklu piyano, elektrik piyano, org, yaylılar, üflemeliler ve daha birçoğunun da dahil olduğu 1500 adetin üzerinde temel enstrüman seslerini sizlere sunmaktadır. Bu enstrüman seslerinin içerisinde; Orta Doğu, Türkiye, Endonezya, Vietnam ve Doğu Avrupa gibi farklı müzik kültürlerinin enstrümanlarının sesleri de beraberinde gelmektedir. Her ses, en gerçekçi ve yüksek kalite için her biri kendi yerel müzik sahnesinde bir uzman ve başarılı müzisyenler ile işbirliği içinde geliştirilmiştir. Sesler bölgeye göre kategorize edilerek dizilmiştir. Bu sayede performansınız esnasında mükemmel sesleri hızla ve kolayca bulabilirsiniz.\nWAV Sample Sesler Yükleyerek, Dahili Ses Bankalarınızı Genişletin\nHafızasındaki 1500 adetlik dahili tonlar sadece bir başlangıçtır. Birçok performans sanatçısı bugünlerde önceden test ettiği veya kullandığı sample sesleri kullanmaktadır. E-A7’nin sample yükleme fonkisyonu sayesinde, sizde WAV uzantılı ses dosyalarınızı yükleyebilirsiniz. Bunun yanında, dahilindeki sampling fonksiyonu ile kendi özel enstrüman seslerinizi, davul beatleri veya vocal sesleri dahil olmak üzere yaratabilirsiniz. Tek ihtiyacınız olan ses kaynağınızı doğrudan klavyeye bağlamak olacaktır. Daha sonra sesinizi dahada parlatmak ve zenginleştirmek için dahilinde bulunan efektleri ekleyebilir, ve performans show’unuz öncesinde dilediğiniz efektleri deneyerek en mükemmel soundu kolayca yakalayabilirsiniz.\nHızlı, Mantıklı Panel Yerleşimi ile Altyapı Ritimleri Solda, Enstrüman Sesleri Sağda\nBazı arranger klavyelerin birçok fonksiyonu bulunur, fakat bunları kullanmak biraz karmaşık ve zordur. Özellikle kalabalık ve güzel bir akşam için beklentisi olan insanların önünde bu durum daha da zorlaşmaktadır. E-A7 ise mantıklı olarak yerleştirilen, sol tarafta alt yapı ritimlerini, sağ tarafta ise enstrüman seslerini ve bunlarla ilgili bilgileri gösteren iki ayrı bölümün kendine özel LCD ekranıyla donatılmıştır. Bunun yanında 156 adet hızlı erişim düğmesi ile en çok kullandığınız birçok fonksiyona hızlıca erişebilir, klavye üzerinde ayarlar ile uğraşmak yerine müziğinize daha fazla zamnınızı ayıracak, doğru düğme kombinasyonlarını bulmak için panic yaşamayacaksınız.\nMükemmel Bir Performans için Tüm Temeller Parmaklarınızın Ucunda\nSahnede çalarken, sadece işinize odaklanmaya ihtiyacınız olacak. Çünkü E-A7; en çok kullandığınız birçok fonksiyona size direk ulaşım imkanını sunmaktadır. Altı adet pad’leri üzerinde ihtiyacınız olduğu and ses dosyalarınızı veya MIDI phrase’lerinizi çaldırabilirsiniz. Sadece bu bölge üzerinde bir tuşa dokunarak farklı müzikal scale’lere ulaşabileceksiniz. Ayrıca dahilindeki altı adetlik slider kontrolleriyle, davul, bas ve akumpanya gibi her bir bölümün ses seviyelerini ayarlayabilirsiniz. Son olarak, dahilindeki pitch-bend kolunun üst kısmında bulunan yedi adetlik görev atanabilir düğmeleri, sizin kişisel gereksinimlerinize göre ne yapmak istiyorsanız ayarlayabileceğiniz ve pitch bend kolu üzerinden elinizi kaldırmadan ulaşabileceğiniz şekilde dizayn edildi.\nMikrofonunuzu Bağlayın, Sesinizi Ayarlayın ve Şarkı Söylemeye Başlayın\nEğer repertuarınızın önemli bir bölümünü vokal partileri içeriyorsa, E-A7 mikrofon girişi ile birlikte ön panelinde özel ses seviyesi kontrolünü size sunarak, sadece bir potans çevirerek klavyenin system menüsü içerisinde kaybolmanıza gerek kalmadan vokal ses seviyenizi hızlıca ayarlayabilirsiniz. Ayrıca profesyonel seviyedeki vokal efektleri ile sesinizi cilalandıracak ve parlatacak, performansınız anında çok yönlü dahilindeki reverb ve delay efektlerini ayarlayabilirsiniz.\nSadece 8 Kg Ağırlık ile Her Yere Rahatça Taşıyın\nHer zaman sahnede çalarken ihtiyacınız olan herşeyin bir arada olması mükemmeldir. Aksi taktirde ağır bir klavye ve diğer ekipmanları taşımak biraz belinize acı verebilir. E-A7 sahne müzisyenlerinin hayatlarına iki yönde kolaylık getiriyor. İlk olarak mükemmel bir performans için herşeyin bir arada olmasıyla ekstra kutu taşımanıza veya bağlantılar yapmanıza gerek olmadan hemen sahneye hazır olabilmenizdir. İkincisi ise performansınız öncesinde veya sonrasında hafif gövdesiyle kolayca her yere taşıyabilmenizdir. 61 tuşlu kompakt yapısının içerisine birçok güç ile donatılmış ve sadece 8 kg ağırlığıyla, size belinize acı vermeden klavyenizi bir yerden bir yere götürebilmenizi sunuyor.\nÇok Yönlü, SMF Şarkı Çalıcısı ile Birlikte WAV/MP3 Audio Dosyaları da Çalabilme\nE-A7’ nin dahilindeki şarkı çalıcısı Standart MIDI dosyalarını (SMF) okuyabilir ve bunun yanında WAV ve MP3 ses dosyalarını da çalabilmektedir. Kapsamlı çalma seçenekleri ile şarkının bir bölümünü tekrar etmek, bir bölümüne atlamak gibi farklı işlemlere izin verebilir. Eğer WAV ses dosyası çaldırıyorsanız, Center Cancel özelliği ile vokal kanallarını minimize edip kendi sesiniz için alan yaratıp üzerine kendi sesinizle vokal yapabilirsiniz. Ayrıca hali hazırdaki performanslarınızı kayıt edip, WAV ses dosyası formatında USB hafıza biriminizde saklayabilirsiniz. Bu sayede müziğinizi sosyal ortamlarda paylaşmanız için saatlerce uğraşmanıza gerek kalmayacaktır.\nEsnek Kullanıcı Programları Kontrolü Sizin Elinize Sunuyor\nE-A7 tasarlandığından itibaren düğmelerinde ve slider kontrollerinde size “zorunlu-gerekli” olan tüm kontroller parmaklarınızın altında bulunuyor. Ayrıca; temel ayarlamalarınızın açık-kapalı durumları, otomatik atak veya giriş efektleri gibi birçok ayarlarınızı tek bir programa kayıt edebilirsiniz. Bu kontroldeki ilave katmanlar sayesinde klavyenizin her bir ayarını her bir şarkıya kayıt edebilir ve çalarken anında geçiş yapabilirsiniz. Roland’ın BK serisi arranger klavyelerinden gelen kullanıcı programlarını USB hafıza birimi üzerinden okuyabilmektedir.\nKullanıcı Tonları/Davul Kitleri, Sample Sesleriniz ve Daha Fazlasını Bilgisayarınızda Yönetin\nE-A7 Tone Manager yazılımı, Mac veya Windows bilgisayarla E-A7 deneyimlerinizi geliştirmenizi sağlar. Kullanıcı tonları ve davul kitleri oluşturmak, performans ayarlarını yapmak ve tüm E-A7 ton verilerinizi yönetmek için ton kütüphanesi, editör ve sample ses yaratıcı işlevler bulunur. Büyük bilgisayar ekranınızda birden fazla parametre gösterilerek, herhangi bir müzik tarzı için E-A7 ayarlarınızı kişiselleştirmek ve düzenlemek artık daha da kolay.","whatsappNote":"","tags":"","images":["https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-183931338-png.png","https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-183948026-png.png","https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-184054987-png.png"],"order":200,"source":"Sentos Excel","id":"4957054507020","originalUrl":"https://tr.roland.com/products/e-a7/"},{"id":"11100320300359","name":"Event 2030 3Yollu Studyo Monitörü (TAKIM çift)","barcode":"11100320300359","brand":"Event","model":"2030","price":"48.700,00","priceNumber":48700,"qty":1,"status":"Satılık","type":"İkinci El – Yeni Gibi","publish":true,"featured":false,"shortDesc":"Takım olarak(2 kolon), Stüdyoda temiz kullanılmış, kutulu, hiç bir fiziki ve elektronik hatası yoktur.","description":"Event 2030 3Yollu Studyo Monitörü\nEvent'in hoparlör konusundaki geçmişi ve başarısı herkes tarafından kabul edilmiş bir gerçektir. Event 20/20 serisi ile stüdyo monitör'ing imkanını tüm dünya'da sayısız sanatçı ve mühendislere sunmuş ve stüdyoların vazgeçilmezi haline gelmiştir.\nEvent'in ilk üç yollu monitörü olan 2030 ile bu başarılı geçmiş yepyeni ve daha da parlak bir gelecek ile buluşuyor. 2030 kendi kategorisini yeniden tanımlayan ve tüm frekans spektrumu boyunca inanılmaz doğrulukta sound veren üç farklı sürücüye sahip 3-yollu bir stüdyo referans monitörüdür\nÜç Sürücü\nEvent 2030 kendi sınıfında karşılaştırılamayacak performans sunan 3-yollu bir stüdyo monitörüdür.\n2030, inanılmaz detaylı ve geniş bir sound sunmak üzere üç müstakil sürücülü, son derece hassas bir şekilde tasarlanmış akustik dizayn, sinyal işleme ve amplifikatör teknolojisine sahiptir. Elde edilen bass cevabı ise bu boyutlardaki bir hoparlörden beklenenin çok çok üzerindedir.\nHigh-Mid Sürücü\nYeni 2030 ile birlikte Event mühendisleri üç-yollu hoparlör konseptini yepyeni bir boyuta taşımıştır. Bunun sonucu olarak sınıfını yeniden tanımlayan, cazip performans ve fiziksel boyutlara sahip benzersiz bir yakın dinleme monitörü ortaya çıkmıştır.\nYeni wave guide düzeneği hoparlörün mid-range ve yüksek frekans sürücülerini barındırarak ses dağılımı ile güç ve cevap karakteristiklerini optimize etmek üzere tasarlanmıştır.\nKritik orta frekans sürücüsü için tasarlanan 3.5\" lik koni transducer (güç çevirici) preslenmiş kağıt hamuru ve polypropylen'den oluşan koni ile birlikte optimize edilmiş bir manyetik devreden oluşmaktadır. Sürücü derin olmayan bir waveguide üzerine yerleştirilerek çok düşük distorsiyon ve yüksek hassasiyet ile yüksek çıkış gücü sağlanmıştır. Tüm bu özellikler 2030 referans monitörlerine inanılmaz detaylı ve belirgin bir vokal karakteri kazandırmaktadır.","whatsappNote":"","tags":"","images":["https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-224837925-png.png","https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-224904972-png.png","https://adaespor.sentos.com.tr/urunres/gorsel-2026-05-09-224916550-png.png"],"order":210,"source":"Sentos Excel","originalUrl":"https://www.audiotechnology.com/reviews/event-2030-three-way-active-nearfield-monitors"}]};

function cardHtml(p){var id=idOf(p);return '<article class="card"><span class="save-mini">'+icon('bookmark')+'</span><a class="card-media" href="'+productUrl(p)+'" aria-label="'+esc(titleOf(p))+'"><span class="mini-stage"><img loading="lazy" src="'+esc(imgOf(p))+'" alt="'+esc(titleOf(p))+'" onerror="this.style.opacity=.15"></span></a><div class="card-body"><a class="card-title" href="'+productUrl(p)+'">'+esc(titleOf(p))+'</a><div class="meta">'+esc(metaOf(p)||p.shortDesc||'')+'</div><div class="price">'+esc(priceOf(p))+'</div><div class="badge-row">'+typeBadge(p)+statusBadge(p)+tagBadges(p,1)+'</div><div class="barcode">Barkod: '+esc(p.barcode||'-')+'</div><div class="card-actions"><a class="act icon" href="'+phoneHref()+'" title="Telefonla ara">'+icon('phone')+'</a><a class="act icon" href="'+waLink(p)+'" target="_blank" rel="noopener" title="WhatsApp">'+icon('wa')+'</a><button class="act icon" data-action="copy" data-id="'+esc(id)+'" title="Link kopyala">'+icon('copy')+'</button><a class="act icon" href="'+productUrl(p)+'" title="Detay">'+icon('arrow')+'</a></div></div></article>'}
function heroHtml(p){if(!p)return '';return '<section class="hero"><div class="hero-info"><span class="eyebrow">★ Öne çıkan ürün</span><h2>'+esc(titleOf(p))+'</h2><div class="model">'+esc(metaOf(p)||p.shortDesc||'')+'</div><div class="desc">'+esc(p.shortDesc||'Kaliteli ürünler, doğru insanlar. Detay ve stok bilgisi için bizimle iletişime geçebilirsiniz.')+'</div><div><span class="price">'+esc(priceOf(p))+'</span></div><div class="badge-row">'+typeBadge(p)+statusBadge(p)+tagBadges(p,2)+'</div><div class="hero-actions"><a class="act primary" href="'+phoneHref()+'">'+icon('phone')+' Ara</a><a class="act whatsapp" target="_blank" rel="noopener" href="'+waLink(p)+'">'+icon('wa')+' WhatsApp</a><button class="act icon" data-action="copy" data-id="'+esc(idOf(p))+'">'+icon('copy')+'</button><a class="act icon" href="'+productUrl(p)+'">'+icon('arrow')+'</a></div></div><a class="hero-stage" href="'+productUrl(p)+'"><span class="stage"><img src="'+esc(imgOf(p))+'" alt="'+esc(titleOf(p))+'" onerror="this.style.opacity=.15"></span></a></section>'}
function home(){var arr=getProducts();var featured=arr.find(function(p){return p.featured})||arr[0];var cards=arr.filter(function(p){return !featured||idOf(p)!==idOf(featured)});var html=headerHtml()+heroHtml(featured)+'<div class="result-count">'+arr.length+' ürün gösteriliyor</div>';if(!arr.length)html+='<div class="empty"><div><b>Ürün bulunamadı</b><span>Arama veya filtreyi değiştirerek tekrar deneyin.</span></div></div>';else html+='<section class="grid">'+cards.map(cardHtml).join('')+'</section>';html+='<footer class="foot"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 45c10-6 22-6 34 0 5 2 8 2 12 0"/><path d="M8 52c10-5 22-5 34 0 6 2 10 2 14 0"/><path d="M22 30c5-8 12-13 23-12"/><path d="M33 20c-3 7-5 14-5 23"/><circle cx="14" cy="13" r="5"/></svg><div><b>'+esc(S.siteTitle||'Ada eMarket Ürün Vitrini')+'</b><br>Kaliteli ürünler, doğru insanlar.</div></footer>';qs('#app').innerHTML=html;wireHome()}
function findProduct(id){return products.find(function(p){return String(idOf(p))===String(id)||String(p.barcode||'')===String(id)})}
function detail(id){var p=findProduct(id);if(!p){home();return}currentProduct=p;var imgs=(p.images&&p.images.length?p.images:[imgOf(p)]).filter(Boolean);var main=imgs[0]||'';var similar=products.filter(function(x){return idOf(x)!==idOf(p)&&((x.brand&&x.brand===p.brand)||(x.status&&x.status===p.status)||(String(x.type||'')===String(p.type||'')))}).slice(0,4);var html=headerHtml()+'<a class="back" href="./">← Vitrine dön</a><section class="detail"><div class="detail-gallery"><div class="stage detail-stage"><img id="mainImg" src="'+esc(main)+'" alt="'+esc(titleOf(p))+'" onerror="this.style.opacity=.15"></div><div class="thumbs">'+imgs.map(function(src,i){return '<button class="thumb '+(i===0?'active':'')+'" data-src="'+esc(src)+'"><img src="'+esc(src)+'" alt=""></button>'}).join('')+'</div></div><div class="detail-info"><div class="badge-row">'+typeBadge(p)+statusBadge(p)+(p.featured?'<span class="badge featured">Öne çıkan</span>':'')+tagBadges(p,3)+'</div><h1>'+esc(titleOf(p))+'</h1><div class="subline">'+esc(metaOf(p))+'</div><div class="price">'+esc(priceOf(p))+'</div><div class="barcode"><b>Barkod/EAN:</b> '+esc(p.barcode||'-')+' &nbsp; <b>Adet:</b> '+esc(p.qty||1)+'</div><div class="detail-actions"><a class="act primary" href="'+phoneHref()+'">'+icon('phone')+' Telefonla Ara</a><a class="act whatsapp" target="_blank" rel="noopener" href="'+waLink(p)+'">'+icon('wa')+' WhatsApp</a><button class="act" data-action="copy" data-id="'+esc(idOf(p))+'">'+icon('copy')+' Link Kopyala</button>'+(p.originalUrl?'<a class="act" target="_blank" rel="noopener" href="'+esc(p.originalUrl)+'">Orijinal Sayfa '+icon('arrow')+'</a>':'')+'</div>'+(p.shortDesc?'<div class="section"><h3>Kısa Açıklama</h3><div class="text">'+esc(p.shortDesc)+'</div></div>':'')+'<div class="section"><h3>Açıklama</h3><div class="text">'+esc(p.description||'Bu ürün hakkında detaylı bilgi için bizimle iletişime geçebilirsiniz.')+'</div></div></div></section>'+(similar.length?'<section class="similar"><h2>Benzer ürünler</h2><div class="grid">'+similar.map(cardHtml).join('')+'</div></section>':'');qs('#app').innerHTML=html;wireHome();qsa('.thumb').forEach(function(b){b.addEventListener('click',function(){qsa('.thumb').forEach(function(x){x.classList.remove('active')});this.classList.add('active');qs('#mainImg').src=this.dataset.src})})}
function wireHome(){var si=qs('#searchInput');if(si){si.addEventListener('input',function(){searchText=this.value;home()})}var ss=qs('#sortSel');if(ss){ss.value=sortMode;ss.addEventListener('change',function(){sortMode=this.value;home()})}qsa('.chip').forEach(function(c){c.addEventListener('click',function(){activeFilter=this.dataset.filter||'';home()})})}
document.addEventListener('click',function(e){var btn=e.target.closest('[data-action]');if(!btn)return;if(btn.dataset.action==='copy'){e.preventDefault();copyLink(btn.dataset.id)}});
var params=new URLSearchParams(location.search);if(params.get('urun'))detail(params.get('urun'));else home();
</script></body></html>
